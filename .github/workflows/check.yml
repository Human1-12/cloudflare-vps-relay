name: Validate tools
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p test_tools.py -v
      - run: python3 tools/build_installer.py && git diff --exit-code -- install.sh
      - run: bash -n install.sh
      - run: npm run dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
